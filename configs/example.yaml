# Copy this file to configs/local.yaml and adjust local values.
# Stable data-source defaults live in src/data2001/defaults.py.

database:
  host: localhost
  port: 5432
  database: data2001
  user: data2001
  password: data2001
  schema_name: data2001

task2_import:
  # For submission evidence, each member can work on one selected SA4.
  # Use `greater_sydney` only when the whole-region run is required.
  crawl_scope: selected_sa4
  gccsa_name: Greater Sydney
  selected_sa4_by_member:
    xfan0282: Sydney - City and Inner South
    dabi0142: Sydney - Parramatta
    jzho0172: Sydney - North Sydney and Hornsby
    xuyu8020: Sydney - Northern Beaches
  sa4_codes: []
  clean_batch_size: 1000

task3_score:
  score_universe: selected_sa4
  min_population: 100
  score_version: baseline

workflow:
  enabled_steps:
    - plan_import
    - import_boundaries
    - validate_boundaries
    - import_poi
    - import_income
    - compute_score

dashboard:
  host: 0.0.0.0
  port: 8050
  debug: false

charts:
  scale: 5
  top_n: 15
